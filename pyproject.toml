[project]
name = "aba-sudoku"
version = "0.1.0"
description = "Sudoku solver comparison app with a FastAPI backend and React UI."
readme = "plan.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1.0",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.2,<9.0",
]
clingo = ["clingo>=5.8"]
neural_net = ["tqdm>=4.0"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

